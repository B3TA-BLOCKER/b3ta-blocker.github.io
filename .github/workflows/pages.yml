# Optional full replacement for your existing Pages workflow (yarn-based).
# If you already have a working workflow, do NOT replace it - just add the
# "Fetch HTB data" step before your build step instead.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 3 * * *"   # daily rebuild so HTB changes show up
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn
      - run: yarn install --immutable

      - name: Fetch HTB data
        run: node scripts/fetch-htb.mjs
        env:
          HTB_APP_TOKEN: ${{ secrets.HTB_APP_TOKEN }}

      - name: Build
        run: yarn build
        env:
          EXPORT: "true"
          UNOPTIMIZED: "true"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4